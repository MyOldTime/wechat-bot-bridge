[project]
name = "wechat-bot-bridge"
version = "0.1.0"
description = "An MCP notification bridge for the WeChat iLink Bot"
readme = "README.md"
requires-python = "==3.12.13"
license = { text = "MIT" }
authors = [
  { name = "wechat-bot-bridge maintainers" },
]
dependencies = [
  "aiosqlite>=0.21.0,<1",
  "cryptography>=46,<50",
  "fastapi>=0.116.0,<1",
  "httpx>=0.28.1,<1",
  "jinja2>=3.1.6,<4",
  "mcp>=1.30,<2",
  "pydantic-settings>=2.10.0,<3",
  "qrcode>=8.2,<9",
  "uvicorn[standard]>=0.35.0,<1",
]

[project.urls]
Repository = "https://github.com/MyOldTime/wechat-bot-bridge"
Issues = "https://github.com/MyOldTime/wechat-bot-bridge/issues"
Releases = "https://github.com/MyOldTime/wechat-bot-bridge/releases"

[project.scripts]
wechat-bot-bridge = "wechat_bot_bridge.bootstrap.cli:main"

[dependency-groups]
build = [
    "pyinstaller>=6.21.0,<7",
    "pywin32>=311 ; sys_platform == 'win32'",
]
dev = [
  "mypy>=1.17.0,<2",
  "pytest>=8.4.0,<10",
  "pytest-asyncio>=1.1.0,<2",
  "pytest-cov>=6.2.0,<8",
  "ruff>=0.12.0,<1",
  "types-qrcode>=7.4.0,<9",
]

[build-system]
requires = ["hatchling>=1.27.0,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wechat_bot_bridge"]

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple"
default = true

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: requires external services or Docker",
  "manual: requires a real WeChat account and QR login",
]

[tool.coverage.run]
branch = true
source = ["wechat_bot_bridge"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
allowed-confusables = ["，", "：", "；"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
